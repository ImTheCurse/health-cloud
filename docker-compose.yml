services:
  postgres:
    image: postgres:17-alpine
    container_name: health-cloud-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-healthcloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-healthcloud}
      POSTGRES_DB: ${POSTGRES_DB:-healthcloud}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-healthcloud} -d ${POSTGRES_DB:-healthcloud}"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2-alpine
    container_name: health-cloud-nats
    restart: unless-stopped
    # -js enables JetStream; without it NATS is at-most-once and persists
    # nothing, so a notification published with no consumer attached is gone.
    # -sd is the store directory the file-backed stream lives in.
    command: ["-js", "-sd", "/data"]
    ports:
      # Bound to localhost: the broker has no authentication yet, so it must not
      # be reachable from the network. Revisit at step 8.
      - "127.0.0.1:${NATS_PORT:-4222}:4222"
    volumes:
      - nats_data:/data
    healthcheck:
      # The monitoring port is not enabled, so liveness is checked by seeing
      # whether the server accepts a TCP connection on the client port.
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8222/healthz || nc -z 127.0.0.1 4222"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Prefect's own database, deliberately separate from the app's.
  prefect-postgres:
    image: postgres:17-alpine
    container_name: health-cloud-prefect-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: prefect
      POSTGRES_PASSWORD: prefect
      POSTGRES_DB: prefect
    volumes:
      - prefect_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prefect -d prefect"]
      interval: 5s
      timeout: 5s
      retries: 10

  prefect:
    image: prefecthq/prefect:3-latest
    container_name: health-cloud-prefect
    restart: unless-stopped
    depends_on:
      prefect-postgres:
        condition: service_healthy
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://prefect:prefect@prefect-postgres:5432/prefect
      PREFECT_API_URL: http://127.0.0.1:4200/api
      PREFECT_SERVER_API_HOST: 0.0.0.0
    command: ["prefect", "server", "start", "--no-services"]
    ports:
      # Localhost only, like NATS: the server has no authentication and its API
      # can start any registered flow run. Revisit at step 8.
      - "127.0.0.1:${PREFECT_PORT:-4200}:4200"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:4200/api/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12

  prefect-services:
    image: prefecthq/prefect:3-latest
    container_name: health-cloud-prefect-services
    restart: unless-stopped
    depends_on:
      prefect:
        condition: service_healthy
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://prefect:prefect@prefect-postgres:5432/prefect
      PREFECT_API_URL: http://prefect:4200/api
    command: ["prefect", "server", "services", "start"]

volumes:
  postgres_data:
  nats_data:
  prefect_db:
